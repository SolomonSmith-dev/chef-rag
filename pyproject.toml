[project]
name = "chef-rag"
version = "0.1.0"
description = "Production-grade RAG for professional culinary knowledge"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.50.0", # OpenRouter uses OpenAI-compatible API
    "supabase>=2.0.0",
    "langfuse>=4.0.0",
    "sentence-transformers>=3.0.0", # bge-reranker-base
    "ragas==0.3.9", # 0.4.x fails to import against langchain-community 0.4
    "rank-bm25>=0.2.2",
    "tiktoken>=0.7.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "pypdf>=6.19.0",
    "langchain-community>=0.3.27,<0.4",
    "langchain-core<1",
    "langchain<1",
    "langchain-openai<1",
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
chef-rag = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["rank_bm25", "sentence_transformers", "tiktoken", "langfuse.*", "ragas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
